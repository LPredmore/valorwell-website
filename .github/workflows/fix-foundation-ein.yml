name: Fix Foundation EIN

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-foundation-ein.yml

permissions:
  contents: write

jobs:
  replace-ein:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Foundation EIN everywhere it is tracked
        shell: bash
        run: |
          set -euo pipefail
          old_ein='93-3129''745'
          new_ein='99-2872954'

          mapfile -t files < <(git grep -l -F "$old_ein" || true)
          if (( ${#files[@]} == 0 )); then
            echo "No occurrences of the old Foundation EIN remain."
            exit 0
          fi

          printf 'Updating %d tracked file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          for file in "${files[@]}"; do
            sed -i "s/${old_ein}/${new_ein}/g" "$file"
          done

          if git grep -n -F "$old_ein"; then
            echo "Old EIN still present after replacement."
            exit 1
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Correct ValorWell Foundation EIN to 99-2872954"
          git push
