name: Validate Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired Supabase dependencies
        run: bash .github/scripts/check-retired-supabase-references.sh
      - name: Enforce website positioning guardrails
        run: node scripts/check-positioning-guardrails.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run lint
      - name: Prove real React server prerendering
        run: node scripts/run-prerender-proof.mjs
      - name: Install Chromium for isolated browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify donation flow and hydration without external requests
        run: npm run test:browser
