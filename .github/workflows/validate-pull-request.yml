name: Validate Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired Supabase dependencies
        run: bash .github/scripts/check-retired-supabase-references.sh
      - name: Enforce website positioning guardrails
        run: node scripts/check-positioning-guardrails.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Prove real React server prerendering
        run: node scripts/run-prerender-proof.mjs
