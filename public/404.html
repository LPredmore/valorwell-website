<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | ValorWell</title>
    <meta name="robots" content="noindex,follow" />
    <meta
      name="description"
      content="The ValorWell page you requested is no longer available or the address is incorrect."
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
        background: #f4f1e8;
        color: #111814;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f4f1e8; }
      header { border-bottom: 1px solid rgba(59, 81, 71, 0.18); }
      .bar, main { width: min(72rem, calc(100% - 3rem)); margin: 0 auto; }
      .bar { min-height: 4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .brand { color: #111814; font-weight: 800; text-decoration: none; font-size: 1.1rem; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.9rem; }
      nav a { color: #3b5147; }
      main { padding: clamp(4rem, 10vw, 8rem) 0 7rem; }
      .eyebrow { color: #3b5147; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
      h1 { max-width: 48rem; margin: 1rem 0 0; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1.02; letter-spacing: -0.04em; }
      p { max-width: 42rem; margin-top: 1.5rem; font-size: 1.125rem; line-height: 1.7; color: #34443c; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
      .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border-radius: 0.3rem; padding: 0.75rem 1rem; font-weight: 800; text-decoration: none; }
      .primary { background: #3b5147; color: white; }
      .secondary { border: 1px solid rgba(59, 81, 71, 0.35); color: #3b5147; }
      a:focus-visible { outline: 3px solid #d7a92e; outline-offset: 3px; }
      @media (max-width: 640px) { nav { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/">VALORWELL</a>
        <nav aria-label="Primary">
          <a href="/about">About</a>
          <a href="/impact">Impact</a>
          <a href="/resources">Resources</a>
          <a href="/get-care">Find Care</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="eyebrow">404 · Page not found</div>
      <h1>This page is no longer available.</h1>
      <p>
        The address may be outdated, the page may have been retired, or the URL may be incorrect.
        Use the current ValorWell site to continue.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Go to ValorWell</a>
        <a class="button secondary" href="/get-care">Find Care</a>
        <a class="button secondary" href="/resources">Browse Resources</a>
      </div>
    </main>
  </body>
</html>
