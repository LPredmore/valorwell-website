<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">ValorWell model from VA coverage to actual care</title>
  <desc id="desc">VA says care is covered, ValorWell makes that coverage usable, the Foundation bridges structural gaps, and lessons from those gaps feed back into system change.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf5"/>
      <stop offset="1" stop-color="#f4f1e8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163e31"/>
      <stop offset="1" stop-color="#294f40"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26312f"/>
      <stop offset="1" stop-color="#3a4541"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a47718"/>
      <stop offset="1" stop-color="#c59a38"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#111814" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#paper)"/>

  <!-- subtle mountains and trees -->
  <path d="M0 118 L95 48 L172 98 L265 22 L352 92 L450 46 L545 108 L650 38 L742 94 L835 46 L900 98 L900 0 L0 0Z" fill="#d9ddd2" opacity="0.45"/>
  <path d="M0 152 L108 86 L188 130 L292 70 L380 132 L485 90 L575 146 L690 78 L780 126 L900 80 L900 0 L0 0Z" fill="#cbd2c6" opacity="0.28"/>
  <g fill="#687a6f" opacity="0.24">
    <path d="M35 144 l18-45 18 45h-12l14 30H33l14-30z"/><path d="M87 150 l15-38 15 38h-10l12 25H85l12-25z"/>
    <path d="M817 146 l18-45 18 45h-12l14 30h-40l14-30z"/><path d="M770 152 l15-38 15 38h-10l12 25h-34l12-25z"/>
  </g>

  <!-- headline -->
  <text x="450" y="90" text-anchor="middle" fill="#101b18" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="45">
    <tspan x="450" dy="0">We started by making</tspan>
    <tspan x="450" dy="50">VA coverage usable.</tspan>
  </text>
  <text x="450" y="192" text-anchor="middle" fill="#b58627" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25">
    <tspan x="450">Then we discovered some of the gaps</tspan>
    <tspan x="450" dy="31">were built into the system.</tspan>
  </text>

  <!-- panel 1 -->
  <g filter="url(#shadow)">
    <rect x="55" y="250" width="790" height="175" rx="22" fill="url(#green)"/>
  </g>
  <circle cx="165" cy="337" r="61" fill="#f7f4e9" stroke="#d4aa4b" stroke-width="6"/>
  <g fill="none" stroke="#164235" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="137" y="297" width="48" height="62" rx="4"/>
    <path d="M149 315h25M149 329h25M149 343h18"/>
  </g>
  <circle cx="196" cy="354" r="20" fill="#a87b24"/>
  <path d="M186 354l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="246" y1="277" x2="246" y2="399" stroke="#dfc887" stroke-width="2"/>
  <text x="280" y="295" fill="#d7a92e" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24">01 —</text>
  <text x="280" y="339" fill="#fffdf5" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34">VA says care is covered</text>
  <text x="280" y="373" fill="#f5f2e8" font-family="Georgia, 'Times New Roman', serif" font-size="18">
    <tspan x="280">Programs like CHAMPVA and VA Community Care</tspan>
    <tspan x="280" dy="24">offer benefits on paper.</tspan>
  </text>
  <path d="M785 393l-58-66-50 49-54-40-62 57z" fill="#102f27" opacity="0.28"/>
  <g fill="#102f27" opacity="0.35"><path d="M752 391l12-44 12 44z"/><path d="M799 392l10-36 10 36z"/><path d="M708 392l9-31 9 31z"/></g>

  <!-- arrow 1 -->
  <path d="M450 430v24h-14l14 18 14-18h-14v-24z" fill="#bd8c28" stroke="#fff" stroke-width="4"/>

  <!-- panel 2 -->
  <g filter="url(#shadow)"><rect x="55" y="470" width="790" height="185" rx="22" fill="url(#charcoal)"/></g>
  <circle cx="165" cy="562" r="61" fill="#f7f4e9" stroke="#d4aa4b" stroke-width="6"/>
  <g fill="none" stroke="#164235" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 575c18-26 57-26 78 0"/>
    <path d="M131 575v18M148 566v27M182 566v27M199 575v18"/>
  </g>
  <circle cx="165" cy="533" r="12" fill="#d7a92e"/>
  <path d="M135 548l30-18 30 18" fill="none" stroke="#164235" stroke-width="5"/>
  <line x1="246" y1="497" x2="246" y2="629" stroke="#dfc887" stroke-width="2"/>
  <text x="280" y="515" fill="#d7a92e" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24">02 —</text>
  <text x="280" y="554" fill="#fffdf5" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32">
    <tspan x="280">ValorWell makes that</tspan><tspan x="280" dy="36">coverage usable</tspan>
  </text>
  <text x="280" y="617" fill="#f5f2e8" font-family="Georgia, 'Times New Roman', serif" font-size="17">
    <tspan x="280">We build the therapist network, billing, authorizations,</tspan>
    <tspan x="280" dy="22">referrals, and access so coverage can turn into treatment.</tspan>
  </text>
  <path d="M784 624l-70-76-45 42-57-38-60 72z" fill="#111c1a" opacity="0.28"/>
  <g fill="#111c1a" opacity="0.35"><path d="M753 625l12-44 12 44z"/><path d="M802 625l10-38 10 38z"/><path d="M705 625l10-34 10 34z"/></g>

  <!-- arrow 2 -->
  <path d="M450 660v24h-14l14 18 14-18h-14v-24z" fill="#d7a92e" stroke="#fff" stroke-width="4"/>

  <!-- panel 3 -->
  <g filter="url(#shadow)"><rect x="55" y="700" width="790" height="185" rx="22" fill="url(#gold)"/></g>
  <circle cx="165" cy="792" r="61" fill="#f7f4e9" stroke="#e1c15f" stroke-width="6"/>
  <path d="M165 762c-14-18-42-6-38 16 4 22 38 42 38 42s34-20 38-42c4-22-24-34-38-16z" fill="#c7962c"/>
  <path d="M129 815c13-15 23-18 36-8M201 815c-13-15-23-18-36-8" fill="none" stroke="#164235" stroke-width="8" stroke-linecap="round"/>
  <line x1="246" y1="727" x2="246" y2="859" stroke="#f0daa1" stroke-width="2"/>
  <text x="280" y="745" fill="#f7da8f" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24">03 —</text>
  <text x="280" y="786" fill="#fffdf5" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="29">
    <tspan x="280">When the system creates a gap,</tspan>
    <tspan x="280" dy="34">the Foundation bridges it</tspan>
  </text>
  <text x="280" y="849" fill="#fff8e5" font-family="Georgia, 'Times New Roman', serif" font-size="17">
    <tspan x="280">The ValorWell Foundation pays for therapy</tspan>
    <tspan x="280" dy="22">when the existing system still fails.</tspan>
  </text>
  <path d="M784 854l-60-67-50 46-48-36-58 57z" fill="#725016" opacity="0.26"/>
  <g fill="#725016" opacity="0.34"><path d="M752 855l12-44 12 44z"/><path d="M800 855l10-36 10 36z"/><path d="M708 855l9-31 9 31z"/></g>

  <!-- feedback loop -->
  <path d="M820 846c28 0 36 18 36 45v8c0 35-18 51-57 51H105c-38 0-57-17-57-51v-28" fill="none" stroke="#164235" stroke-width="7" stroke-linecap="round"/>
  <path d="M48 867l-13 21h26z" fill="#164235"/>
  <rect x="245" y="895" width="410" height="66" rx="33" fill="#e7e7dc"/>
  <g fill="#164235"><rect x="280" y="929" width="9" height="18" rx="2"/><rect x="295" y="918" width="9" height="29" rx="2"/><rect x="310" y="907" width="9" height="40" rx="2"/></g>
  <line x1="337" y1="910" x2="337" y2="947" stroke="#76897d" stroke-width="2"/>
  <text x="355" y="922" fill="#164235" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16">
    <tspan x="355">What we learn from the gaps helps us</tspan>
    <tspan x="355" dy="20">work to change the system.</tspan>
  </text>

  <!-- closing statement -->
  <line x1="110" y1="980" x2="270" y2="980" stroke="#c4902d" stroke-width="2"/>
  <line x1="630" y1="980" x2="790" y2="980" stroke="#c4902d" stroke-width="2"/>
  <text x="450" y="979" text-anchor="middle" fill="#101b18" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22">Three connected parts.</text>
  <text x="450" y="999" text-anchor="middle" fill="#b58627" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20">One mission: actual care.</text>
</svg>