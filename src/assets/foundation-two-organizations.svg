  <text x="1145" y="430" text-anchor="middle" fill="#F7F1E5" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700">ValorWell Foundation</text>
  <text x="1145" y="470" text-anchor="middle" fill="#A8BC9F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5">NONPROFIT FOUNDATION</text><line x1="900" y1="492" x2="1390" y2="492" stroke="#CDA74F" stroke-width="1.4" opacity="0.65"/>
  <circle cx="950" cy="566" r="43" fill="#203C30" stroke="#D6AB46" stroke-width="2"/><g transform="translate(950 566)" fill="#E3B64C"><circle cx="-15" cy="-12" r="10"/><circle cx="15" cy="-12" r="10"/><circle cx="0" cy="-22" r="11"/><path d="M-37 22 C-36 1 -27 -3 -15 -3 C-4 -3 2 3 4 14 L4 25 L-37 25 Z"/><path d="M-4 25 L-4 10 C-4 -5 5 -10 15 -10 C28 -10 37 0 38 22 L38 25 Z"/></g>
  <text x="1040" y="550" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">Pays community therapists</text><text x="1040" y="584" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">when coverage is delayed</text><text x="1040" y="618" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">or denied</text>
  <circle cx="950" cy="670" r="43" fill="#203C30" stroke="#D6AB46" stroke-width="2"/><path d="M950 631 L961 657 L990 659 L968 677 L975 705 L950 690 L925 705 L932 677 L910 659 L939 657 Z" fill="#E3B64C"/>
  <text x="1040" y="660" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">Supports veterans and</text><text x="1040" y="696" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">immediate family members</text>
  <line x1="130" y1="817" x2="330" y2="817" stroke="#D7A92E" stroke-width="2"/><line x1="1270" y1="817" x2="1470" y2="817" stroke="#D7A92E" stroke-width="2"/>
  <text x="800" y="831" text-anchor="middle" fill="#F3EEE2" font-family="Georgia, 'Times New Roman', serif" font-size="38">Separate structures. <tspan fill="#E3B64C">One mission: faster access to care.</tspan></text>
</svg>