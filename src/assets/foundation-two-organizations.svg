  <text x="800" y="205" text-anchor="middle" fill="#9DB09E" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="9">DIFFERENT STRUCTURES · SHARED PURPOSE</text>
