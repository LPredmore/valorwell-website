  <text x="455" y="430" text-anchor="middle" fill="#F7F1E5" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700">ValorWell</text>
  <text x="455" y="470" text-anchor="middle" fill="#A8BC9F" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5">FOR-PROFIT CLINIC</text><line x1="210" y1="492" x2="700" y2="492" stroke="#CDA74F" stroke-width="1.4" opacity="0.65"/>
  <circle cx="260" cy="566" r="43" fill="#203C30" stroke="#D6AB46" stroke-width="2"/><g transform="translate(260 566)" fill="none" stroke="#E3B64C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 16 C-26 9 -27 -13 -13 -23 C1 -33 21 -25 24 -8 C26 5 18 15 7 18 L7 28 L-4 28 L-4 19 Z"/><path d="M0 -8 C0 -16 10 -18 14 -11 C18 -18 28 -16 28 -8 C28 1 14 10 14 10 C14 10 0 1 0 -8 Z" transform="translate(-13 -2) scale(.62)" fill="#E3B64C" stroke="none"/></g>
  <text x="350" y="558" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">Provides mental</text><text x="350" y="596" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">health care</text>
  <circle cx="260" cy="662" r="43" fill="#203C30" stroke="#D6AB46" stroke-width="2"/><g transform="translate(260 662)" fill="none" stroke="#E3B64C" stroke-width="4"><rect x="-22" y="-28" width="44" height="56" rx="2"/><line x1="-12" y1="-12" x2="12" y2="-12"/><line x1="-12" y1="0" x2="12" y2="0"/><line x1="-12" y1="12" x2="6" y2="12"/></g>
  <text x="350" y="654" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">Accepts VACCN</text><text x="350" y="692" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29">and CHAMPVA</text>
  <rect x="840" y="315" width="610" height="420" rx="22" fill="url(#card)" stroke="#CDA74F" stroke-width="1.5"/>
  <circle cx="1145" cy="315" r="66" fill="#153026" stroke="url(#gold)" stroke-width="4"/>
