  <line x1="475" y1="162" x2="725" y2="162" stroke="#D7A92E" stroke-width="2" opacity="0.85"/><line x1="875" y1="162" x2="1125" y2="162" stroke="#D7A92E" stroke-width="2" opacity="0.85"/>
