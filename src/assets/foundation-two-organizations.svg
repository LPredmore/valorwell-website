<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two organizations. Two jobs.</title>
  <desc id="desc">A side-by-side comparison of ValorWell, the for-profit clinic, and the separate nonprofit ValorWell Foundation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1411"/><stop offset="0.56" stop-color="#13231C"/><stop offset="1" stop-color="#09100D"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C861"/><stop offset="1" stop-color="#B9861F"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183126" stop-opacity="0.97"/><stop offset="1" stop-color="#0E1D17" stop-opacity="0.98"/></linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#23382E"/><stop offset="1" stop-color="#C19A4B"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE4A3" stop-opacity="0.95"/><stop offset="1" stop-color="#D7A92E" stop-opacity="0"/></radialGradient>
  </defs>
